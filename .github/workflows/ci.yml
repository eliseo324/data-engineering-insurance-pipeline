name: CI

on:
  pull_request:
    branches: [dll]
  push:
    branches: [dll, "feature/**"]

jobs:
  calidad-codigo:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Pruebas unitarias (pytest + Spark local)
        run: pytest -v
