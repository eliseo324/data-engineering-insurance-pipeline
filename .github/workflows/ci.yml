name: CI

on:
  pull_request:
    branches: [dll]
  push:
    branches: [dll, "feature/**"]
  workflow_call:        

permissions:
  contents: read

jobs:
  calidad-codigo:
    name: Lint, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" 
          cache: pip

      - uses: actions/setup-java@v4 
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Pruebas unitarias e integración local con cobertura mínima
        run: pytest -v --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Compatibilidad de data contracts contra la rama destino
        if: github.event_name == 'pull_request'
        run: python scripts/verificar_contratos.py --base origin/${{ github.base_ref }}

  validar-bundle:
    name: Validar Asset Bundle
    runs-on: ubuntu-latest
    if: vars.CD_HABILITADO == 'true'
    environment: dev
    permissions:
      id-token: write     
      contents: read
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle validate (dev)
        run: databricks bundle validate -t dev