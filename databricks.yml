bundle:
  name: insurance-medallion

include:
  - resources/jobs/*.yml

variables:
  ambiente:
    description: Ambiente lógico (dev | qa | prod)
    default: dev
  catalog:
    description: Catálogo de Unity Catalog del ambiente
    default: workspace
  schema:
    description: Esquema de Unity Catalog
    default: default
  volume:
    description: Volumen de aterrizaje de archivos
    default: volume1
  pause_status:
    description: Estado del schedule (UNPAUSED | PAUSED)
    default: UNPAUSED

targets:
  dev:
    default: true
    mode: development           
    workspace:
      host: https://dbc-9d099d66-dc7e.cloud.databricks.com
    variables:
      pause_status: PAUSED

  qa:
    workspace:
      host: https://adb-qa.azuredatabricks.net           
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      ambiente: qa
      catalog: qa_seguros
      pause_status: PAUSED

  prod:
    mode: production             
    workspace:
      host: https://adb-prod.azuredatabricks.net          
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: sp-insurance-medallion-prod 
    variables:
      ambiente: prod
      catalog: prd_seguros
      pause_status: UNPAUSED
